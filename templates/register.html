
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your Store - SmartCart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            color: #4f46e5;
            font-weight: 800;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            padding: 11px;
            margin-bottom: 16px;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <div class="brand">🛒 SmartCart</div>
        <p class="subtitle">Register your grocery store</p>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <label class="form-label" for="store_name">Store Name</label>
            <input class="form-control"
                   type="text"
                   id="store_name"
                   name="store_name"
                   maxlength="100"
                   placeholder="Enter your grocery store name"
                   required>

            <label class="form-label" for="username">Owner Username</label>
            <input class="form-control"
                   type="text"
                   id="username"
                   name="username"
                   maxlength="50"
                   autocomplete="username"
                   placeholder="Choose a username"
                   required>

            <label class="form-label" for="password">Password</label>
            <input class="form-control"
                   type="password"
                   id="password"
                   name="password"
                   minlength="8"
                   autocomplete="new-password"
                   placeholder="At least 8 characters"
                   required>

            <label class="form-label" for="confirm_password">
                Confirm Password
            </label>
            <input class="form-control"
                   type="password"
                   id="confirm_password"
                   name="confirm_password"
                   minlength="8"
                   autocomplete="new-password"
                   placeholder="Enter your password again"
                   required>

            <button class="btn-register" type="submit">
                Register My Store
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already registered?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</body>
</html>
