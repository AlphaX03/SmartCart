<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartCart - Edit Product</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body class="dashboard-body">


    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="logo-icon">
                🛒
            </div>

            <div>

                <h2>SmartCart</h2>

                <span>Management System</span>

            </div>

        </div>


        <nav class="sidebar-nav">

            <p class="nav-title">
                MAIN MENU
            </p>


            <a
                href="{{ url_for('dashboard') }}"
                class="nav-item"
            >

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>


            <a
                href="{{ url_for('products') }}"
                class="nav-item active"
            >

                <i class="fa-solid fa-box"></i>

                <span>Products</span>

            </a>


            <a href="#" class="nav-item">

                <i class="fa-solid fa-cart-shopping"></i>

                <span>Billing</span>

            </a>


            <a href="#" class="nav-item">

                <i class="fa-solid fa-chart-line"></i>

                <span>Sales</span>

            </a>


            <a
    href="{{ url_for('reports') }}"
    class="nav-item"
>
    <i class="fa-solid fa-chart-pie"></i>
    <span>Reports</span>
</a>


            <p class="nav-title settings-title">
                SYSTEM
            </p>


            <a href="#" class="nav-item">

                <i class="fa-solid fa-gear"></i>

                <span>Settings</span>

            </a>


            <a
                href="{{ url_for('logout') }}"
                class="nav-item logout-item"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </a>

        </nav>

    </aside>


    <main class="main-content">


        <header class="topbar">

            <div>

                <h1>Edit Product</h1>

                <p>
                    Update product information
                </p>

            </div>


            <div class="user-profile">

                <div class="notification">

                    <i class="fa-regular fa-bell"></i>

                </div>


                <div class="profile-avatar">
                    A
                </div>


                <div class="profile-info">

                    <strong>
                        {{ session["username"] }}
                    </strong>

                    <span>
                        Administrator
                    </span>

                </div>

            </div>

        </header>


        <section class="dashboard-content">


            <div class="product-form-card">

                <div class="form-header">

                    <h2>
                        Edit Product
                    </h2>

                    <p>
                        Update the information below.
                    </p>

                </div>


                {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

                {% endif %}


                <form
                    method="POST"
                    class="product-form"
                >


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="product_name"
                                value="{{ product.product_name }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Category
                            </label>

                            <select
                                name="category"
                                required
                            >

                                <option value="Grocery"
                                    {% if product.category == "Grocery" %}selected{% endif %}>
                                    Grocery
                                </option>

                                <option value="Dairy"
                                    {% if product.category == "Dairy" %}selected{% endif %}>
                                    Dairy
                                </option>

                                <option value="Beverages"
                                    {% if product.category == "Beverages" %}selected{% endif %}>
                                    Beverages
                                </option>

                                <option value="Snacks"
                                    {% if product.category == "Snacks" %}selected{% endif %}>
                                    Snacks
                                </option>

                                <option value="Fruits"
                                    {% if product.category == "Fruits" %}selected{% endif %}>
                                    Fruits
                                </option>

                                <option value="Vegetables"
                                    {% if product.category == "Vegetables" %}selected{% endif %}>
                                    Vegetables
                                </option>

                                <option value="Personal Care"
                                    {% if product.category == "Personal Care" %}selected{% endif %}>
                                    Personal Care
                                </option>

                                <option value="Household"
                                    {% if product.category == "Household" %}selected{% endif %}>
                                    Household
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                name="price"
                                step="0.01"
                                min="0"
                                value="{{ product.price }}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Stock Quantity
                            </label>

                            <input
                                type="number"
                                name="stock_quantity"
                                class="form-control"
                                min="0"
                                step="any"
                                required
                                value="{{ product.stock_quantity }}"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label>
                                Unit
                            </label>

                            <select
                                name="unit"
                                required
                            >

                                <option value="pcs"
                                    {% if product.unit == "pcs" %}selected{% endif %}>
                                    Pieces
                                </option>

                                <option value="kg"
                                    {% if product.unit == "kg" %}selected{% endif %}>
                                    Kilogram
                                </option>

                                <option value="g"
                                    {% if product.unit == "g" %}selected{% endif %}>
                                    Gram
                                </option>

                                <option value="litre"
                                    {% if product.unit == "litre" %}selected{% endif %}>
                                    Litre
                                </option>

                                <option value="ml"
                                    {% if product.unit == "ml" %}selected{% endif %}>
                                    Millilitre
                                </option>

                                <option value="pack"
                                    {% if product.unit == "pack" %}selected{% endif %}>
                                    Pack
                                </option>

                                <option value="box"
                                    {% if product.unit == "box" %}selected{% endif %}>
                                    Box
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label>
                                Barcode
                            </label>

                            <input
                                type="text"
                                name="barcode"
                                value="{{ product.barcode or '' }}"
                                placeholder="Optional"
                            >

                        </div>

                    </div>


                    <div class="form-actions">

                        <a
                            href="{{ url_for('products') }}"
                            class="cancel-button"
                        >
                            Cancel
                        </a>


                        <button
                            type="submit"
                            class="save-button"
                        >

                            <i class="fa-solid fa-save"></i>

                            Save Changes

                        </button>

                    </div>


                </form>

            </div>

        </section>

    </main>

</body>

</html>
